name: Bootstrap PROJECT ECHO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project archive
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/project-echo.tar.gz
          echo "6757a4520f0767c0a71ca041e3f2254caa0fbe44dd343fda6278206c9c47b9c1  /tmp/project-echo.tar.gz" | sha256sum --check
          tar -xzf /tmp/project-echo.tar.gz
          rm -rf .bootstrap

      - name: Commit restored project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Project is already restored."
          else
            git commit -m "Build playable PROJECT ECHO prototype"
            git push
          fi
